name: Generate package-lock

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate package-lock.json
        run: |
          npm install --package-lock-only

      - name: Verify lockfile has no PLACEHOLDER
        run: |
          if grep -q "PLACEHOLDER" package-lock.json; then
            echo "Found PLACEHOLDER in package-lock.json"; exit 1;
          fi

      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(ci): add real package-lock.json generated by workflow" || echo "no changes to commit"
          git push origin main || echo "push failed"

  remove-workflow:
    runs-on: ubuntu-latest
    needs: generate-lock
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/generate-lock.yml || echo "file already removed"
          git commit -m "chore(ci): remove temporary lockfile generator workflow" || echo "no changes to commit"
          git push origin main || echo "push failed"
