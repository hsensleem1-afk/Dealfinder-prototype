<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DealFinder Prototype</title><link rel="stylesheet" href="style.css">
</head><body><div class="app">
<header><div class="brand"><span class="logo">D</span><div><b>DealFinder</b><small>AI finds the better deal</small></div></div><button id="refresh">↻</button></header>
<main>
<section class="hero"><span>LIVE DEAL ENGINE</span><h1>Best deals.<br><em>Found for you.</em></h1><p>Fresh offers are continuously discovered and ranked.</p><strong>● LIVE</strong></section>
<div class="search">⌕ <input id="search" placeholder="Search products or brands…"><button id="clear">×</button></div>
<div class="chips"><button class="active" data-cat="All">All</button><button data-cat="Electronics">Electronics</button><button data-cat="Fashion">Fashion</button><button data-cat="Travel">Travel</button><button data-cat="Home">Home</button></div>
<section class="head"><div><small>DISCOVERED NOW</small><h2>Just Found</h2></div><i>● Updating</i></section>
<div id="feed"></div>
</main><nav><button class="active">⌂<small>Deals</small></button><button>⌕<small>Search</small></button><button>♡<small>Watch</small></button><button>◉<small>Profile</small></button></nav>
</div><div id="toast"></div><script src="app.js"></script></body></html>
